{% extends "base.html" %}
{% from "_macros.html" import doc_row %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Documentos recentes</h1>
  <span class="text-muted small">{{ total }} documento(s) no total</span>
</div>

{% if documents %}
  <div class="card"><div class="card-body pt-1">
    {% for doc in documents %}{{ doc_row(doc) }}{% endfor %}
  </div></div>
{% else %}
  <div class="alert alert-info">
    Nenhum documento ainda. <a href="{{ url_for('documents.upload') }}">Envie o primeiro</a>.
  </div>
{% endif %}
{% endblock %}
