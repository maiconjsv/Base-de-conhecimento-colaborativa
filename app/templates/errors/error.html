{% extends "base.html" %}
{% block title %}{{ code }} · {{ title }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-4 text-muted">{{ code }}</div>
  <h1 class="h4 mt-2">{{ title }}</h1>
  <p class="text-muted">{{ message }}</p>
  <div class="mt-4 d-flex gap-2 justify-content-center">
    <a class="btn btn-primary" href="{{ url_for('documents.index') }}">Ir para o início</a>
    <a class="btn btn-outline-secondary" href="javascript:history.back()">Voltar</a>
  </div>
</div>
{% endblock %}
