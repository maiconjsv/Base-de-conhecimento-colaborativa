<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Base de Conhecimento{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('documents.index') }}">📚 Base de Conhecimento</a>
    <div class="d-flex align-items-center gap-2 flex-grow-1 justify-content-end">
      {% if current_user.is_authenticated %}
      <form class="d-flex" role="search" action="{{ url_for('documents.search') }}" method="get">
        <input class="form-control form-control-sm me-2" type="search" name="q"
               placeholder="Buscar por palavra-chave…" value="{{ request.args.get('q', '') }}"
               style="min-width: 260px">
        <button class="btn btn-sm btn-light" type="submit">Buscar</button>
      </form>
      <a class="btn btn-sm btn-light" href="{{ url_for('documents.upload') }}">+ Enviar</a>
      <span class="navbar-text small text-white-50 d-none d-lg-inline">{{ current_user.username }}</span>
      <a class="btn btn-sm btn-outline-light" href="{{ url_for('auth.logout') }}">Sair</a>
      {% endif %}
    </div>
  </div>
</nav>

<main class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
